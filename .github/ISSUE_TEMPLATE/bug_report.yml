name: Bug report
description: Something in the app doesn't work the way it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Security problems go through private reporting instead (see SECURITY.md), not a public issue.
        Please don't paste API keys, tokens, real customer names, phone numbers or call recordings here.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw. Include the exact error message if there was one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path that shows the bug. Demo mode is the easiest place to reproduce.
      placeholder: |
        1. DEMO_MODE=true npm run dev
        2. Open /library and pick "Inbound lead: leaking water heater"
        3. Start a text call and type ...
        4. See ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Persona library
        - Persona wizard
        - Pre-flight briefing
        - Live call deck and coach
        - Debrief
        - Progress
        - Team view
        - Models page
        - Voice (ElevenLabs)
        - Voice (OpenAI Realtime)
        - Command palette
        - Theme or dark mode
        - Accounts, MFA or access code
        - Rate limits
        - Persona pack content
        - Something else
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: Setup
      description: Which configuration were you running?
      options:
        - Demo mode, no keys (DEMO_MODE=true)
        - Demo mode with an AI key
        - Voice keys configured (ElevenLabs or OpenAI Realtime)
        - Full setup with a database and accounts
        - A hosted deployment
    validations:
      required: true

  - type: dropdown
    id: call-mode
    attributes:
      label: Call mode (if it happened during a call)
      options:
        - Not during a call
        - Text simulation
        - Voice
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the deployment date.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on macOS, Safari on iPhone 15
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Browser console or server output
      description: Remove keys, tokens, cookies and personal data before pasting.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I removed secrets and personal data from everything above.
          required: true
